<div class="h-full w-full flex items-center justify-center bg-slate-100 px-6 py-10">
  <div class="w-full max-w-5xl">
    <div class="mb-6 text-center">
      <h1 class="text-3xl sm:text-5xl font-bold text-slate-900 tracking-tight">
        Control de Evacuación y Registro
      </h1>
      <p class="text-slate-600 text-base sm:text-lg mt-3">
        Seleccione el modo de trabajo según la operación que vaya a realizar.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <button
        (click)="selectEvacuationMode()"
        class="group text-left rounded-2xl border border-red-200 bg-gradient-to-br from-red-50 to-amber-50 p-6 shadow-sm hover:shadow-lg hover:border-red-300 transition-all duration-300"
      >
        <div>
          <h2 class="text-2xl font-bold text-red-900 mb-2">Modo Evacuación</h2>
          <p class="text-red-900/80 leading-relaxed">
            Gestión de asistencia en punto de encuentro y validación rápida durante una emergencia.
          </p>
        </div>
        <div class="mt-5 text-sm font-semibold text-red-800">
          Abrir módulo de evacuación
        </div>
      </button>

      <button
        (click)="selectNfcMode()"
        class="group text-left rounded-2xl border border-slate-200 bg-white p-6 shadow-sm hover:shadow-lg hover:border-slate-300 transition-all duration-300"
      >
        <div>
          <h2 class="text-2xl font-bold text-slate-900 mb-2">Modo Registro NFC</h2>
          <p class="text-slate-600 leading-relaxed">
            Registro normal de asistencia mediante lector NFC, sesiones y exportación de resultados.
          </p>
        </div>
        <div class="mt-5 text-sm font-semibold text-slate-700">
          Abrir registro NFC
        </div>
      </button>
    </div>
  </div>
</div>
