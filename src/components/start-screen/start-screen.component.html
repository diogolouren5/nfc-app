<div class="flex flex-col items-center justify-center h-full bg-gray-100">
  <div class="text-center p-8 bg-white rounded-xl shadow-lg">
    <h1 class="text-4xl font-bold text-primary mb-4">
      Sistema de Registro NFC
    </h1>
    <p class="text-gray-600 mb-8">
      Ingrese el nombre del evento para comenzar una nueva sesión de registro.
    </p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <input 
        #eventNameInput
        (keyup.enter)="startEvent(eventNameInput)"
        type="text" 
        placeholder="NOMBRE DEL EVENTO" 
        class="px-4 py-3 bg-gray-700 text-white placeholder-gray-400 border-2 border-accent rounded-lg w-full sm:w-80 focus:ring-2 focus:ring-accent focus:outline-none transition-colors duration-300"
      >
      <button 
        (click)="startEvent(eventNameInput)"
        class="bg-primary text-white font-bold py-3 px-8 rounded-lg hover:bg-accent transition-colors duration-300 shadow-md">
        Iniciar Evento
      </button>
    </div>
  </div>
</div>
